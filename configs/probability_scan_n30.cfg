# ====================================================================
# Configuration: Probability Dynamics across Transverse Field g: N = 30
# Evaluates local minima trajectories and time-averaged P_<(t) over [0, 60]
# ====================================================================

# System size N = 30
n = 30

# Transverse field coupling strengths to evaluate
g_values = 0.3, 0.35, 0.45

# Time evolution grid: t in [0, 60.0] with step dt = 0.05 (1200 steps)
dt = 0.05
t_max = 60.0

# Seed persistence directory and minima selection
seeds_dir = seeds
pool_minima_count = 250

# Number of symmetry-distinct local minima to evaluate (1 = deepest trap #1, 10 = all 10 traps)
top_minima_count = 10

# Optional: specific trap ranks (1-based, e.g. 1, 2). If empty, evaluates top_minima_count
# trap_ranks = 1

# Whether to also evaluate transverse field alone H_X (false saves 50% GPU runtime)
compute_transverse = false

# Execution mode: continuous trajectory logging and skip classical baselines
record_trajectory = true
shots_per_point = 0
run_classical = false

# Output file paths
time_series_csv = data_processed/probability_dynamics_n30.csv
results_csv     = data_processed/probability_dynamics_n30_results.csv
summary_csv     = data_processed/probability_dynamics_n30_summary.csv
