# ==============================================================================
# Bernasconi-Krylov Benchmark Configuration (N = 20)
# ==============================================================================

[system]
n_values                = 20
seed_base               = 42
device                  = auto

[traps]
pool_minima_count       = 250
benchmark_trap_count    = 0
max_energy_ranks        = 2
minima_cache_dir        = seeds
force_regenerate_traps  = false

[quantum]
g_values                = 0.3, 0.35, 0.45
dt                      = 0.05
t_max                   = 60.0
record_trajectory       = true
dt_trajectory           = 0.05
t_start                 = 10.0
dt_sample               = 1.5
k_sample_points         = 20
m_shots_per_point       = 100
num_sampling_seeds      = 3
seed_stride             = 10007
track_p_less            = true

[classical]
kick_trials_per_d       = 50000
kick_d_values           = 2, 4, 6, 8, 10, 12
restart_trials          = 50000
max_evals_per_start     = 0
batch_size              = 10000
enable_tabu             = true
tabu_trials             = 50000
tabu_max_steps          = 100
tabu_kick_d_values      = 2, 4, 6, 8, 10, 12
tabu_tenure             = 0

[output]
output_dir              = data_processed
results_csv             = benchmark_results_n20.csv
time_series_csv         = p_less_dynamics_n20.csv
summary_csv             = benchmark_summary_n20.csv
structured_json         = structured_benchmark_n20.json
all_structured_json     = all_seeds_benchmark.json
verbose                 = true
