# ====================================================================
# Configuration: Probability Dynamics across Transverse Field g: N = 22
# Evaluates local minima trajectories and time-averaged P_<(t) over [0, 60]
# ====================================================================

# System size N = 22
n = 22

# Transverse field coupling strengths to evaluate
g_values = 0.3, 0.35, 0.45

# Time evolution grid: t in [0, 60.0] with step dt = 0.05 (1200 steps)
dt = 0.05
t_max = 60.0

# Seed persistence directory and minima selection
seeds_dir = seeds
pool_minima_count = 200

# Number of symmetry-distinct local minima to evaluate (0 = all seeds in seeds_N22.csv)
top_minima_count = 0

# Whether to also evaluate transverse field alone H_X
compute_transverse = false

# Execution mode: continuous trajectory logging and skip classical baselines
record_trajectory = true
shots_per_point = 0
run_classical = false

# Output file paths
time_series_csv = data_processed/probability_dynamics_n22.csv
results_csv     = data_processed/probability_dynamics_n22_results.csv
summary_csv     = data_processed/probability_dynamics_n22_summary.csv
structured_json = data_processed/structured_benchmark_n22.json
