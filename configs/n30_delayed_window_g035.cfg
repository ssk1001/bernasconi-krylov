# ====================================================================
# Delayed Window Benchmark (g = 0.35): N = 30
# Evaluates 10 lowest-energy symmetry-distinct SD minima (orbits)
# ====================================================================

# Minima pool and selection
target_minima_count = 250
pool_minima_count = 250
top_minima_count = 10
minima_selection_mode = top_distinct_minima

# Generalized selection strictly above E* (no forced mandatory energy)
mandatory_energy = -1

# Seed persistence directory (seeds/ directly under project root)
seeds_dir = seeds
force_regenerate_seeds = false

# Quantum measurement sampling seeds per trap level
num_sampling_seeds = 3
seed_base = 42
seed_stride = 10007

# System size N = 30
n_values = 30

# Transverse field coupling strength: g = 0.35
g = 0.35
g_values = 0.35
top_k_augmentation = 0

# Delayed sampling window protocol: t in [10.0, 38.5]
t_start = 10.0
dt_sample = 1.5
dt = 0.05
k_steps = 20

# Method 1: K=20 * M=100 = 2000 evaluations
m_samples = 100

# Method 3: Random kick distance scan d in {2, 4, 6, 8, 10, 12} with 2000 evals per d
kick_scan_d = 2, 4, 6, 8, 10, 12

# Evaluation budget B = 2000
evaluation_budget = 2000

# Classical baseline large-scale trials (10^4 - 10^5 trials per d)
classical_trials_per_d = 50000
restart_trials = 50000

# Optional conditional execution timeout per N in seconds (0 = disabled)
conditional_n_timeout_seconds = 0.0

# Output filenames
csv_results = n30_delayed_window_g035_results.csv
csv_summary = n30_delayed_window_g035_summary.csv
