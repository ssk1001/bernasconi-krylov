# ====================================================================
# SKQD Benchmark Configuration: N=24 (and N=20 conditional), 10 Minima
# ====================================================================

# Minima pool and selection
target_minima_count = 200
pool_minima_count = 200
top_minima_count = 10
minima_selection_mode = distinct_energies

# Explicitly guarantee that the E=52 trap is included
mandatory_energy = 52

# Quantum measurement sampling seeds per trap level
num_sampling_seeds = 3
seed_base = 42
seed_stride = 10007

# Transverse field coupling strength g
g = 0.5
top_k_augmentation = 0

# System sizes N: Evaluate N=24 first, followed by N=20
n_values = 24, 20

# Conditional execution: if N=24 finishes within 1800 seconds (30 mins), proceed to N=20
conditional_n_timeout_seconds = 1800.0

# Total evaluation budget per trial for classical comparison baselines:
# Exactly 2000 energy evaluations (1 eval per sampled bitstring, N per SD step)
evaluation_budget = 2000

# Trotter scans: constant total quantum shot budget K * M = 2000 shots
# 1 shot = 1 sampled bitstring = 1 evaluation
scan = 5, 400, 0.4
scan = 10, 200, 0.2
scan = 20, 100, 0.1
scan = 40, 50, 0.05

# Output filenames
csv_results = n24_n20_budget2000_results.csv
csv_summary = n24_n20_budget2000_summary.csv
