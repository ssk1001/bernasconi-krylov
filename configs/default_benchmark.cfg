# ====================================================================
# SKQD Benchmark Configuration: Default Full Benchmark
# ====================================================================

# Minima search pool and evaluated trap depth levels
target_minima_count = 100
pool_minima_count = 100
top_minima_count = 5

# Quantum measurement sampling seeds (evaluated per trap level)
num_sampling_seeds = 3
seed_base = 42
seed_stride = 10007

# Quantum Hamiltonian & sampling settings
# Transverse field coupling strength g:
# Can be a single value (g = 2.0), multiple values to sweep (g_values = 1.0, 2.0),
# or customized per scan: scan = K, M, dt [, g]
g = 0.5
top_k_augmentation = 0

# System sizes N to evaluate (comma-separated)
n_values = 16, 20, 24

# Trotter scans: format is "scan = K, M, dt [, g]"
# Constant total quantum shot budget: K * M = 2000
scan = 5, 400, 0.4
scan = 10, 200, 0.2
scan = 20, 100, 0.1
scan = 40, 50, 0.05

# Output filenames
csv_results = skqd_benchmark_results.csv
csv_summary = skqd_summary_statistics.csv
