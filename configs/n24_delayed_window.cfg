# ====================================================================
# Delayed Window Benchmark (g=0.5): N=24, 10 Symmetry-Distinct Minima
# ====================================================================

# Minima pool and selection
target_minima_count = 200
pool_minima_count = 200
top_minima_count = 10
minima_selection_mode = distinct_energies

# Generalized selection: evaluate the 10 best distinct local minima strictly above E*
mandatory_energy = -1

# Quantum measurement sampling seeds per trap level
num_sampling_seeds = 3
seed_base = 42
seed_stride = 10007

# System size N = 24
n_values = 24

# Transverse field coupling strengths to sweep for M1
g_values = 0.15, 0.25, 0.35, 0.5, 0.75
top_k_augmentation = 0

# Delayed sampling window parameters
# t_k = 10.0, 11.5, ..., 38.5 (K=20, dt_sample=1.5, simulation dt=0.05)
t_start = 10.0
dt_sample = 1.5
dt = 0.05
k_steps = 20

# Method 1: Dynamical sampling (M=100 -> K*M = 2000 energy evaluations)
m_samples = 100

# Method 2: Sampling (M=90 -> 1800 evals) + SD on lowest 5 sampled strings (<= 200 evals)
quench_m_samples = 90
quench_top_strings = 5

# Method 3: Random kick + SD scanning d = 2, 4, ..., 12 with budget 2000 per d
kick_scan_d = 2, 4, 6, 8, 10, 12
evaluation_budget = 2000

# Classical baseline large-scale trials (10^4 - 10^5 trials per d)
classical_trials_per_d = 50000
restart_trials = 50000

# Output filenames
csv_results = n24_delayed_window_results.csv
csv_summary = n24_delayed_window_summary.csv
