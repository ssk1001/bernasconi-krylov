# ==============================================================================
# Bernasconi-Krylov Modern Benchmark Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. System & Global Settings
# ------------------------------------------------------------------------------
[system]
n_values                = 16, 20, 24       # System sizes N to benchmark (comma-separated)
seed_base               = 42               # Master RNG seed for reproducibility
device                  = auto             # Execution backend: "auto", "gpu", or "cpu"

# ------------------------------------------------------------------------------
# 2. Trap Basin Collection & Selection
# ------------------------------------------------------------------------------
[traps]
pool_minima_count       = 100              # Total unique symmetry-reduced local minima to discover
benchmark_trap_count    = 5                # Number of distinct local minima (traps E_0) to benchmark
minima_cache_dir        = seeds            # Directory to cache/load discovered trap states
force_regenerate_traps  = false            # Set true to bypass cache and regenerate traps

# ------------------------------------------------------------------------------
# 3. Quantum Dynamics & Delayed Sampling Window
# ------------------------------------------------------------------------------
[quantum]
g_values                = 0.25, 0.5, 0.75  # Transverse field coupling strengths to evaluate
dt                      = 0.05             # Trotter simulation step (numerical integration resolution)

# Sampling Window Parameters:
t_start                 = 10.0             # Sampling start time (burn-in delay; evolves 0 -> t_start before sampling)
dt_sample               = 1.5              # Sampling delta t (time interval between measurement points)
k_sample_points         = 20               # Number of measurement points K (times t_k = t_start + k * dt_sample)
m_shots_per_point       = 100              # Projective measurement shots M per sampling point

# Exact Probability Tracking:
track_p_less            = true             # Track exact noise-free P_<(t) via GPU reduction

# ------------------------------------------------------------------------------
# 4. Classical Baselines (Trials-Based Protocol)
# ------------------------------------------------------------------------------
[classical]
kick_trials_per_d       = 50000            # Independent trials per kick distance d (10^4 - 10^5)
kick_d_values           = 1, 2, 3, 4, 5, 6 # Hamming distances d to sweep for selecting d*
restart_trials          = 50000            # Independent trials for Restart-SD (10^4 - 10^5)
max_evals_per_start     = 0                # Eval limit per descent trajectory (0 = unlimited until local min)
batch_size              = 10000            # Concurrency chunk size for GPU batch descent kernel

# ------------------------------------------------------------------------------
# 5. Output & Logging
# ------------------------------------------------------------------------------
[output]
output_dir              = data_raw         # Destination directory for raw experiment outputs
results_csv             = benchmark_results_n{N}.csv  # Detailed per-trap comparison metrics
time_series_csv         = p_less_dynamics_n{N}.csv    # Full P_<(t) time series per trap and g
summary_csv             = benchmark_summary.csv       # Aggregate summary across N and g
verbose                 = true             # Print real-time progress and comparison tables
