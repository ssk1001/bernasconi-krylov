# ==============================================================================
# Bernasconi-Krylov Benchmark Configuration (N = 24)
# ==============================================================================

[system]
n_values                = 24
seed_base               = 42
device                  = auto

[traps]
pool_minima_count       = 250
benchmark_trap_count    = 10
minima_cache_dir        = seeds
force_regenerate_traps  = false

[quantum]
g_values                = 0.3, 0.35, 0.45
dt                      = 0.05
t_start                 = 10.0
dt_sample               = 1.5
k_sample_points         = 20
m_shots_per_point       = 100
track_p_less            = true

[classical]
kick_trials_per_d       = 50000
kick_d_values           = 2, 4, 6, 8, 10, 12
restart_trials          = 50000
max_evals_per_start     = 0
batch_size              = 10000

[output]
output_dir              = data_raw
results_csv             = benchmark_results_n24.csv
time_series_csv         = p_less_dynamics_n24.csv
summary_csv             = benchmark_summary_n24.csv
verbose                 = true
